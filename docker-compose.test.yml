x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "10"
    compress: "true"

services:
  app:
    build: .
    restart: always
    logging: *default-logging
    volumes:
      - ./app:/app
      - ./mediafiles:/vol/media
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_NAME=${POSTGRES_NAME}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_SEARCH_PATH=${POSTGRES_SEARCH_PATH:-administracion,almacen,ubigeo,ventas,public}
      - POSTGRES_APPS=${POSTGRES_APPS:-}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - DJANGO_CORS_ALLOWED_ORIGINS=${DJANGO_CORS_ALLOWED_ORIGINS}
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS}
      - FRONTEND_URL=${FRONTEND_URL}
      - ENVIRONMENT=${ENVIRONMENT}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - CLOUDFLARE_R2_BUCKET=${CLOUDFLARE_R2_BUCKET}
      - CLOUDFLARE_R2_ACCESS_KEY=${CLOUDFLARE_R2_ACCESS_KEY}
      - CLOUDFLARE_R2_SECRET_KEY=${CLOUDFLARE_R2_SECRET_KEY}
      - CLOUDFLARE_R2_ENDPOINT=${CLOUDFLARE_R2_ENDPOINT}
      - CLOUDFLARE_R2_MAIN_URL=${CLOUDFLARE_R2_MAIN_URL}
      - API_TOKENS=${API_TOKENS}
      - PROVIDER_NAME=${PROVIDER_NAME}
      - APP_NAME=${APP_NAME}
      - APP_VERSION=${APP_VERSION}
      - DOC_STORAGE_BACKEND=${DOC_STORAGE_BACKEND}
      - DOC_STORAGE_LOCAL_ROOT=${DOC_STORAGE_LOCAL_ROOT}
      - KARDEX_ABBREVIATIONS=${KARDEX_ABBREVIATIONS}
      - XML_NOTARIA_ROOT=${XML_NOTARIA_ROOT:-/app/xml_notaria}
      - SUNAT_XML_CERTIFICATE_PATH=${SUNAT_XML_CERTIFICATE_PATH}
      - SUNAT_XML_PRIVATE_KEY_PATH=${SUNAT_XML_PRIVATE_KEY_PATH}
      - SUNAT_XML_PFX_PATH=${SUNAT_XML_PFX_PATH:-}
      - SUNAT_XML_PFX_PASSWORD=${SUNAT_XML_PFX_PASSWORD:-}
      - SUNAT_WS_URL=${SUNAT_WS_URL:-}
      - WEB_SERVICE_SUNAT=${WEB_SERVICE_SUNAT:-}
      - RUC_CLAVE_SOL=${RUC_CLAVE_SOL:-}
      - USER_CLAVE_SOL=${USER_CLAVE_SOL:-}
      - PASS_CLAVE_SOL=${PASS_CLAVE_SOL:-}
      - SUNAT_SOL_USERNAME=${SUNAT_SOL_USERNAME:-}
      - SUNAT_SOL_USER=${SUNAT_SOL_USER:-}
      - SUNAT_SOL_PASSWORD=${SUNAT_SOL_PASSWORD:-}
    depends_on:
      db:
        condition: service_started
      postgres:
        condition: service_healthy

  db:
    image: mariadb:10.5
    logging: *default-logging
    environment:
      MARIADB_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MARIADB_DATABASE: ${DATABASE_NAME}
      MARIADB_USER: ${DATABASE_USER}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD}
    # ports:
    #   - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  postgres:
    image: postgres:15-alpine
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    logging: *default-logging
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    image: nginx:latest
    links:
      - app
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
    entrypoint: >+
      sh -c 'if [ "$ENVIRONMENT" = "production" ]; then
        cp /etc/nginx/conf.d/nginx.prod.conf /etc/nginx/nginx.conf;
          elif [ "$ENVIRONMENT" = "testing" ]; then
        cp /etc/nginx/conf.d/nginx.test.conf /etc/nginx/nginx.conf;
          else
        cp /etc/nginx/conf.d/nginx.dev.conf /etc/nginx/nginx.conf;
          fi &&
          nginx -g "daemon off;"'

volumes:
  db_data:
  postgres_data:
